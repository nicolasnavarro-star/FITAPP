name: Compilar APK de Android

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npm test

      - name: Compilar la app web
        run: npm run build

      - name: Sincronizar con el proyecto Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Preparar archivo
        run: cp android/app/build/outputs/apk/release/app-release.apk "Kaizen-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Kaizen-${{ env.VERSION_NAME }}
          path: Kaizen-*.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # La API de GitHub a veces responde con un error pasajero: se reintenta, y si el release
          # quedó creado a medias solo se sube el archivo.
          for intento in 1 2 3 4 5; do
            if gh release view "v${VERSION_NAME}" >/dev/null 2>&1; then
              gh release upload "v${VERSION_NAME}" "Kaizen-${VERSION_NAME}.apk" --clobber && exit 0
            else
              gh release create "v${VERSION_NAME}" "Kaizen-${VERSION_NAME}.apk" \
                --target "${GITHUB_SHA}" \
                --title "Kaizen ${VERSION_NAME}" \
                --notes "Descarga el archivo .apk desde tu teléfono Android y ábrelo para instalar o actualizar Kaizen. Tus datos se conservan al actualizar." && exit 0
            fi
            echo "Intento ${intento} fallido; se reintenta en 20 s"
            sleep 20
          done
          exit 1
